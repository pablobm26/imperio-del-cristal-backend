# Dispara el correo de carrito abandonado todos los días a las 10:00 de Venezuela.
#
# POR QUÉ ACÁ Y NO EN RENDER: los cron jobs de Render son un servicio aparte y de pago. GitHub
# Actions es gratis en repositorios públicos como este, deja ver cada ejecución con su resultado, y
# el disparador queda versionado junto al código en vez de vivir en el panel de un tercero.
#
# QUÉ HACE: una sola llamada HTTP al backend. Toda la lógica —a quién escribirle, qué mandar— vive
# en inventory_backend/email-reminders.js. Esto solo aprieta el botón.
#
# ANTES DE QUE FUNCIONE hay que cargar el secreto en DOS lados, con el MISMO valor:
#   1. Render  → servicio imperio-del-cristal-backend → Environment → CRON_SECRET
#   2. GitHub  → este repo → Settings → Secrets and variables → Actions → New repository secret,
#                con el nombre exacto CRON_SECRET
# Si falta en cualquiera de los dos, el backend responde 401 y esta tarea falla en rojo.

name: Recordatorio de carrito abandonado

on:
  schedule:
    # 14:00 UTC = 10:00 en Venezuela. El país es UTC-4 todo el año, no tiene horario de verano, así
    # que este número no hay que corregirlo dos veces al año.
    # GitHub puede atrasar la ejecución algunos minutos cuando hay mucha carga: para un recordatorio
    # no molesta, pero no esperar que caiga a las 10:00:00 clavadas.
    - cron: "0 14 * * *"
  # Permite dispararlo a mano desde la pestaña Actions, para probar sin esperar al día siguiente.
  # OJO: manda correos a clientes reales, no es un simulacro.
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al backend
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::Falta el secreto CRON_SECRET en este repositorio."
            echo "Cargarlo en Settings → Secrets and variables → Actions, con el mismo valor que en Render."
            exit 1
          fi

          # El secreto viaja en la query string (así está diseñado el endpoint), por eso NO se
          # imprime el comando: solo el código de respuesta y el cuerpo, que trae los conteos.
          # --max-time alto porque si el servicio de Render estaba dormido tarda en despertar.
          RESPUESTA=$(curl -sS --max-time 180 -w $'\n%{http_code}' \
            "https://imperio-del-cristal-backend.onrender.com/cron/cart-reminders?secret=${CRON_SECRET}")

          CODIGO=$(printf '%s' "$RESPUESTA" | tail -n 1)
          CUERPO=$(printf '%s' "$RESPUESTA" | sed '$d')

          echo "HTTP ${CODIGO}"
          echo "Respuesta: ${CUERPO}"

          if [ "${CODIGO}" != "200" ]; then
            echo "::error::El backend respondió ${CODIGO}. 401 = el secreto no coincide con el de Render; 400 = falta RESEND_API_KEY o CART_REMINDER_FROM_EMAIL."
            exit 1
          fi

          # El cuerpo es {"ok":true,"sent":N,"skipped":N,"failed":N}. `sent: 0` no es un error:
          # significa que no había ningún carrito abandonado que calificara.
          echo "::notice::${CUERPO}"
